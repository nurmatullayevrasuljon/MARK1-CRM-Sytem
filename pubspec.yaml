name: markcrm
description: "MARK1 - Aqlli CRM platformasi"
publish_to: 'none'

version: 1.0.2+5003

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  http: ^1.6.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  min_sdk_android: 21
